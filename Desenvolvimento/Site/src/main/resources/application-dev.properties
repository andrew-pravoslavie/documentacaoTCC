# Perfil DEV - Persistência MySQL / MariaDB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/securedesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:securedesk}
spring.datasource.password=${DB_PASSWORD:securedesk123}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf sem cache para hot-reload em dev
spring.thymeleaf.cache=false
