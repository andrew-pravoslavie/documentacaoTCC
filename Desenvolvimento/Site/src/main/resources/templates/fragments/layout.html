<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body>

  <!-- SIDEBAR FRAGMENT -->
  <aside class="sidebar" th:fragment="sidebar(activePage)">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="brand-text">
        <h4>SecureDesk</h4>
        <span>Protótipo TCC</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">Principal</div>
      <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a th:href="@{/ativos}" class="nav-item" th:classappend="${activePage == 'ativos'} ? ' active' : ''">
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Inventário de Ativos
        <span class="nav-badge" th:if="${ativosTexto != null}" th:text="${ativosTexto}">0/100</span>
      </a>

      <div class="nav-section-title">Módulos</div>
      <a th:href="@{/diagnostico}" class="nav-item" th:classappend="${activePage == 'diagnostico'} ? ' active' : ''">
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        Diagnóstico
      </a>
      <a th:href="@{/acompanhamento}" class="nav-item" th:classappend="${activePage == 'acompanhamento'} ? ' active' : ''">
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Acompanhamento
      </a>
      <a th:href="@{/governanca}" class="nav-item" th:classappend="${activePage == 'governanca'} ? ' active' : ''">
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Governança
        <span class="nav-badge" th:text="${totalGaps != null ? totalGaps : '5'}">5</span>
      </a>
      <a th:href="@{/compliance}" class="nav-item" th:classappend="${activePage == 'compliance'} ? ' active' : ''">
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        Compliance
      </a>

      <div class="nav-section-title">Sistema</div>
      <a th:href="@{/configuracoes}" class="nav-item" th:classappend="${activePage == 'configuracoes'} ? ' active' : ''">
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Configurações
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" th:text="${usuarioAvatar != null ? usuarioAvatar : 'GA'}">GA</div>
        <div class="user-info">
          <div class="user-name" th:text="${usuarioNome != null ? usuarioNome : 'Gabriel Andrew'}">Gabriel Andrew</div>
          <div class="user-role" th:text="${usuarioPerfil != null ? usuarioPerfil : 'Administrador'}">Administrador</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- TOPBAR FRAGMENT -->
  <header class="topbar" th:fragment="topbar(pageTitle, breadcrumb)">
    <div class="topbar-left">
      <div class="breadcrumb">
        <a th:href="@{/dashboard}">Início</a>
        <span class="separator">/</span>
        <span th:text="${breadcrumb != null ? breadcrumb : (pageTitle != null ? pageTitle : 'Dashboard')}">Dashboard</span>
      </div>
    </div>
    <div class="topbar-right">
      <!-- Dashboard actions -->
      <th:block th:if="${pageTitle == 'dashboard'}">
        <div class="topbar-search">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar...">
        </div>
        <button class="topbar-icon-btn" title="Notificações">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notif-dot"></span>
        </button>
      </th:block>

      <!-- Diagnostico actions -->
      <th:block th:if="${pageTitle == 'diagnostico'}">
        <div class="topbar-search">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar...">
        </div>
      </th:block>

      <!-- Acompanhamento actions -->
      <th:block th:if="${pageTitle == 'acompanhamento'}">
        <button class="btn btn-secondary btn-sm">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Exportar PDF
        </button>
        <a th:href="@{/diagnostico}" class="btn btn-primary btn-sm">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Reavaliar
        </a>
      </th:block>

      <!-- Governanca actions -->
      <th:block th:if="${pageTitle == 'governanca'}">
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('modal').classList.add('active')">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nova Tarefa
        </button>
      </th:block>

      <!-- Compliance actions -->
      <th:block th:if="${pageTitle == 'compliance'}">
        <button class="btn btn-secondary btn-sm">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Exportar Todos
        </button>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('modal-politica').classList.add('active')">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nova Política
        </button>
      </th:block>

      <!-- Configuracoes actions -->
      <th:block th:if="${pageTitle == 'configuracoes'}">
        <button class="btn btn-primary btn-sm">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          Salvar Alterações
        </button>
      </th:block>

      <!-- Default actions if not matched -->
      <th:block th:if="${pageTitle != 'dashboard' and pageTitle != 'diagnostico' and pageTitle != 'acompanhamento' and pageTitle != 'governanca' and pageTitle != 'compliance' and pageTitle != 'configuracoes'}">
        <div class="topbar-search">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar...">
        </div>
        <button class="topbar-icon-btn" title="Notificações">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notif-dot"></span>
        </button>
      </th:block>
    </div>
  </header>

</body>
</html>
